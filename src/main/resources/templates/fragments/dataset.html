<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dataset Table Fragment</title>
</head>
<body>
<div th:fragment="dataset-filter" class="px-6 py-4 border-b border-gray-200">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <!-- Search and Filter Section (Right) -->
        <div class="flex flex-col sm:flex-row gap-3">
            <!-- Search Input -->
            <div class="sm:w-64">
                <input type="text" name="instrument" placeholder="Search symbols..." th:value="${searchRequest?.instrument}" class="block w-full px-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-red-500 focus:border-red-500 text-sm">
            </div>

            <!-- Source Filter Dropdown -->
            <div class="sm:w-36">
                <select name="provider" class="block w-full px-3 py-2 border border-gray-300 rounded-md leading-5 bg-white focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500 text-sm">
                    <option value="">All Sources</option>
                    <option th:each="provider : ${providers}" th:value="${provider.name}" th:text="${provider.name}" th:selected="${searchRequest?.provider == provider.name}"></option>
                </select>
            </div>

            <!-- Status Filter Dropdown -->
            <div class="sm:w-32">
                <select name="status" class="block w-full px-3 py-2 border border-gray-300 rounded-md leading-5 bg-white focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500 text-sm">
                    <option value="">All Status</option>
                    <option value="downloaded" th:selected="${searchRequest?.status == 'downloaded'}">Downloaded</option>
                    <option value="pending" th:selected="${searchRequest?.status == 'pending'}">Downloading</option>
                </select>
            </div>

            <!-- Search Button -->
            <button type="submit" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                Search
            </button>
        </div>
    </div>
</div>
    <!-- Dataset Table Fragment -->
    <div th:fragment="dataset-table" class="overflow-x-auto relative">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Symbol</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start Date</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">End Date</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Provider</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Records</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="dataset, iterStat : ${datasets}">
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900" th:text="${dataset.symbol}"></div>
                    <div class="text-sm text-gray-500" th:text="${dataset.name}"></div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#temporals.format(dataset.startDate, 'MMM d, yyyy')}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#temporals.format(dataset.endDate, 'MMM d, yyyy')}"></td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                          th:text="${dataset.provider}"
                          th:classappend="${#strings.toLowerCase(dataset.provider) == 'dukascopy'} ? 'bg-orange-100 text-orange-800' : 
                                          (${#strings.toLowerCase(dataset.provider) == 'metatrader'} ? 'bg-blue-100 text-blue-800' : 
                                          'bg-purple-100 text-purple-800')"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${#numbers.formatDecimal(dataset.totalRecords/1000000, 1, 1) + 'M'}"></td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                          th:text="${dataset.status}"
                          th:classappend="${#strings.toUpperCase(dataset.status) == 'DOWNLOADED'} ? 'bg-green-100 text-green-800' :
                                          (${#strings.toUpperCase(dataset.status) == 'PENDING'} ? 'bg-yellow-100 text-yellow-800' : 
                                          'bg-gray-100 text-gray-800')"></span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <button type="button"
                            class="inline-flex items-center p-2 text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 rounded-md">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
                        </svg>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Instrument Selection Fragment -->
    <div th:fragment="instrument" class="mb-6">
        <label for="instrument" class="block text-sm font-medium text-gray-700 mb-2">
            Trading Instrument <span class="text-red-500">*</span>
        </label>
        <select
                id="instrument"
                name="instrument"
                required
                class="block w-full px-4 py-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors"
        >
            <option value="">Choose a trading instrument</option>
            <option th:each="instrument : ${instruments}"
                    th:value="${instrument.platformId}"
                    th:text="${instrument.name} + ' - ' + ${instrument.description}"></option>
        </select>
        <p class="mt-1 text-xs text-gray-500">Select the trading symbol or instrument</p>
    </div>

    <form th:fragment="datatable"
          hx-trigger="submit, change delay:100ms from:select[name='limit']"
          hx-get="/datasets/datatable"
          hx-swap="outerHTML"
          hx-boost="true"
          class="hx-content"
          hx-indicator="#datasets-loading"
          x-show="!loading"
    >
        <div th:replace="~{fragments/dataset :: dataset-filter}"></div>
        <div th:replace="~{fragments/dataset :: dataset-table}"></div>
        <div th:replace="~{fragments/commons :: pagination}"></div>
    </form>

                <div class="sm:w-32">

                <div class="w-20">

    </div>

                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>

            <tbody class="bg-white divide-y divide-gray-200">

        <div class="hidden sm:flex sm:items-center sm:justify-between">

</body>
</html>
