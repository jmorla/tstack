<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tstack | Datasets</title>
    <script type="module" crossorigin src="/assets/modulepreload-polyfill.js"></script>
    <script type="module" crossorigin src="/assets/global.js"></script>
    <script type="module" crossorigin src="/assets/htmx.min.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}" th:with="activeMenu='datasets'"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Main Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
            <div class="p-8">
                <!-- Page Header -->
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Datasets</h1>
                        <p class="text-sm text-gray-500 mt-1">Manage your trading data sources and market datasets</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="add-dataset.html" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/>
                            </svg>
                            Download Dataset
                        </a>
                    </div>
                </div>
                
                <!-- Datasets Card -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 relative">
                    <div hx-get="/datasets/datatable"
                         hx-trigger="load"
                         hx-indicator="#datasets-loading"
                         hx-swap="outerHTML">
                    </div>

                    <!-- Loading Indicator -->
                    <div th:replace="~{fragments/dataset :: datasets-loading}"></div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
