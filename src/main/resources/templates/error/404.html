<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Tstack</title>
    <script type="module" crossorigin src="/assets/modulepreload-polyfill.js"></script>
    <script type="module" crossorigin src="/assets/global.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar ::  sidebar('')}"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Main Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 flex items-center justify-center">
            <div class="text-center px-4">
                <!-- 404 Icon -->
                <div class="mx-auto w-32 h-32 mb-8 flex items-center justify-center">
                    <svg class="w-full h-full text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                    </svg>
                </div>

                <!-- Error Message -->
                <div class="mb-8">
                    <h1 class="text-6xl font-bold text-gray-900 mb-4">404</h1>
                    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
                    <p class="text-gray-600 max-w-md mx-auto leading-relaxed">
                        The trading page you're looking for doesn't exist or has been moved.
                        Let's get you back to analyzing the markets.
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <a href="index.html" class="inline-flex items-center px-6 py-3 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m0 0a1 1 0 001 1h0a1 1 0 001-1m-3 0h3m0 0v-8a1 1 0 011-1h0a1 1 0 011 1v8m0 0h3"/>
                        </svg>
                        Back to Dashboard
                    </a>
                    <button onclick="history.back()" class="inline-flex items-center px-6 py-3 border border-gray-300 rounded-md shadow-sm text-base font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Go Back
                    </button>
                </div>

                <!-- Quick Links -->
                <div class="mt-12 pt-8 border-t border-gray-200">
                    <p class="text-sm text-gray-500 mb-4">Or try these popular sections:</p>
                    <div class="flex flex-wrap justify-center gap-4">
                        <a href="add-dataset.html" class="text-red-600 hover:text-red-700 text-sm font-medium transition-colors">Add Dataset</a>
                        <span class="text-gray-300">•</span>
                        <a href="#" class="text-red-600 hover:text-red-700 text-sm font-medium transition-colors">Strategies</a>
                        <span class="text-gray-300">•</span>
                        <a href="#" class="text-red-600 hover:text-red-700 text-sm font-medium transition-colors">Indicators</a>
                        <span class="text-gray-300">•</span>
                        <a href="#" class="text-red-600 hover:text-red-700 text-sm font-medium transition-colors">Help</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
