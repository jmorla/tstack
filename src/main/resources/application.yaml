spring:
  application:
    name: tstack
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/tstack
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

server:
  error:
    whitelabel:
      enabled: false

application:
  title: Tstack
  version: @project.version@


tstack:
  providers:
    ctrader:
      enabled: true
      client_id: ${CTRADER_CLIENT_ID}
      client_secret: ${CTRADER_CLIENT_SECRET}
      access_token: ${CTRADER_ACCESS_TOKEN}
      account_id: ${CTRADER_ACCOUNT_ID:0}
      host: live.ctraderapi.com
      port: 5035
      enable_ssl: true
      idle_timeout: 30000
      connection_timeout: 30000

logging:
  level:
    com.jmorla.tstack: DEBUG

